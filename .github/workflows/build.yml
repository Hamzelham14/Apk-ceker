name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak proyek
        run: unzip -q PhoneCheck.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        run: | DIR=$(dirname "$(find src -name settings.gradle.kts | head -1)") cd "$DIR" gradle assembleDebug --no-daemon       - uses: actions/upload-artifact@v4
        with:
          name: PhoneCheck-apk
          path: src/**/app/build/outputs/apk/debug/app-debug.apk
